<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style> body { margin: 0; background: #000; overflow: hidden; } </style>
</head>
<body>
    <div id="game"></div>
    <script>
    const firebaseConfig = {
        apiKey: "AIzaSyBMb2Cf30QffPe3Eo8jJQkRlriMlz7yeHw",
        authDomain: "formacrm-a5ff8.firebaseapp.com",
        databaseURL: "https://formacrm-a5ff8-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "formacrm-a5ff8",
        storageBucket: "formacrm-a5ff8.appspot.com",
        appId: "1:389279435422:web:757377855364120ec07530"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const tg = window.Telegram.WebApp;
    tg.expand();
    const userId = tg.initDataUnsafe?.user?.id || "local_player";
    const userName = tg.initDataUnsafe?.user?.first_name || "Сталкер";

    let money = 250, lives = 10, currentWave = 1;
    let selectedTowerType = 'ak', isWaveActive = false;
    let moneyText, livesText, startBtn, menuGroup, gameGroup;
    let towers, enemies, bullets, path;

    const config = {
        type: Phaser.AUTO,
        width: 360, height: 640,
        parent: 'game',
        physics: { default: 'arcade' },
        scene: { preload: preload, create: create, update: update }
    };

    const game = new Phaser.Game(config);

    function preload() {
        this.load.image('ground', 'https://labs.phaser.io/assets/textures/mud.png');
        this.load.image('tower_ak', 'https://labs.phaser.io/assets/sprites/masked-block.png'); 
        this.load.image('tower_svd', 'https://labs.phaser.io/assets/sprites/column.png'); 
        this.load.image('enemy_dog', 'https://labs.phaser.io/assets/sprites/clown.png'); 
        this.load.image('bullet', 'https://labs.phaser.io/assets/sprites/bullets/bullet1.png');
    }

    function create() {
        menuGroup = this.add.container(0, 0);
        gameGroup = this.add.container(0, 0).setVisible(false);

        const menuBg = this.add.rectangle(180, 320, 360, 640, 0x0e120e);
        const title = this.add.text(180, 150, "STALKER\nZONE DEFENSE", { font: 'bold 32px Courier', fill: '#00ff00', align: 'center' }).setOrigin(0.5);
        const welcome = this.add.text(180, 250, `Здравствуй, ${userName}`, { font: '18px Courier', fill: '#00ff00' }).setOrigin(0.5);
        const playBtn = this.add.text(180, 400, "[ ИГРАТЬ ]", { font: '24px Courier', fill: '#ffff00', backgroundColor: '#003300', padding: 10 }).setOrigin(0.5).setInteractive();

        menuGroup.add([menuBg, title, welcome, playBtn]);

        setupGameScene.call(this);

        playBtn.on('pointerdown', () => {
            tg.HapticFeedback.impactOccurred('medium');
            db.ref('stalker_game/' + userId).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    money = data.money || 250;
                    currentWave = data.currentWave || 1;
                    moneyText.setText(`РУБЛИ: ${money}`);
                }
                menuGroup.setVisible(false);
                gameGroup.setVisible(true);
            });
        });
    }

    function setupGameScene() {
        const scene = this;
        const ground = scene.add.tileSprite(180, 320, 360, 640, 'ground').setAlpha(0.4);
        
        path = scene.add.path(40, 0);
        path.lineTo(320, 120); path.lineTo(40, 280); path.lineTo(320, 440); path.lineTo(180, 640);
        
        let graphics = scene.add.graphics().lineStyle(35, 0x111111, 0.7);
        path.draw(graphics);

        towers = scene.add.group();
        enemies = scene.add.group();
        bullets = scene.physics.add.group();

        moneyText = scene.add.text(15, 15, `РУБЛИ: ${money}`, { font: 'bold 16px Courier', fill: '#00ff00' });
        livesText = scene.add.text(240, 15, `ЖИЗНИ: ${lives}`, { font: 'bold 16px Courier', fill: '#ff0000' });
        
        startBtn = scene.add.text(180, 520, "[ В БОЙ ]", { font: '20px Courier', fill: '#00ff00', backgroundColor: '#000' }).setOrigin(0.5).setInteractive();
        
        startBtn.on('pointerdown', () => { 
            if(!isWaveActive) { startWave.call(scene); startBtn.setVisible(false); } 
        });

        const btnAK = scene.add.text(25, 580, ' [АК-74] ', { font: '18px Courier', fill: '#ffff00', backgroundColor: '#002200' }).setInteractive();
        const btnSVD = scene.add.text(190, 580, '  [СВД]  ', { font: '18px Courier', fill: '#00ff00', backgroundColor: '#002200' }).setInteractive();

        btnAK.on('pointerdown', () => { selectedTowerType = 'ak'; btnAK.setStyle({fill:'#ffff00'}); btnSVD.setStyle({fill:'#00ff00'}); });
        btnSVD.on('pointerdown', () => { selectedTowerType = 'svd'; btnSVD.setStyle({fill:'#ffff00'}); btnAK.setStyle({fill:'#00ff00'}); });

        gameGroup.add([ground, graphics, moneyText, livesText, startBtn, btnAK, btnSVD]);

        scene.input.on('pointerdown', (p) => {
            if (p.y > 550 || !gameGroup.visible) return;
            let cost = selectedTowerType === 'ak' ? 50 : 150;
            if (money >= cost) {
                let x = Math.floor(p.x/40)*40+20, y = Math.floor(p.y/40)*40+20;
                const t = scene.add.sprite(x, y, selectedTowerType === 'ak' ? 'tower_ak' : 'tower_svd');
                t.setScale(selectedTowerType === 'ak' ? 0.6 : 1); t.type = selectedTowerType; t.lastFire = 0;
                towers.add(t); 
                money -= cost; 
                moneyText.setText(`РУБЛИ: ${money}`);
                tg.HapticFeedback.selectionChanged();
            }
        });

        // ИСПРАВЛЕННОЕ СТОЛКНОВЕНИЕ
        scene.physics.add.overlap(bullets, enemies, (bullet, enemy) => {
            bullet.destroy();
            enemy.hp -= bullet.damage;
            if (enemy.hp <= 0) {
                enemy.destroy();
                money += 15; // Деньги зачисляются сразу
                moneyText.setText(`РУБЛИ: ${money}`);
            }
        });
    }

    function startWave() {
        const scene = this;
        isWaveActive = true;
        let spawned = 0, total = 5 + currentWave * 2;
        const timer = scene.time.addEvent({
            delay: 1500,
            callback: () => {
                let enemy = scene.add.follower(path, 0, 0, 'enemy_dog').setScale(0.5);
                enemy.hp = 30 + currentWave * 15;
                scene.physics.add.existing(enemy);
                enemy.startFollow({ duration: 10000, onComplete: () => {
                    if (enemy.active) { 
                        lives--; 
                        livesText.setText(`ЖИЗНИ: ${lives}`); 
                        tg.HapticFeedback.notificationOccurred('error'); 
                        enemy.destroy(); 
                    }
                }});
                enemies.add(enemy); spawned++;
                if(spawned >= total) { 
                    timer.remove(); 
                    scene.time.addEvent({
                        delay: 2000,
                        callback: () => {
                            if (enemies.countActive() === 0) {
                                isWaveActive = false; 
                                startBtn.setVisible(true); 
                                currentWave++; 
                                db.ref('stalker_game/' + userId).set({ money: money, currentWave: currentWave });
                            }
                        },
                        loop: true
                    });
                }
            },
            loop: true
        });
    }

    function update() {
        if (!gameGroup.visible) return;
        towers.getChildren().forEach(tower => {
            let range = tower.type === 'ak' ? 140 : 280;
            let damage = tower.type === 'ak' ? 10 : 45;
            let rate = tower.type === 'ak' ? 700 : 2200;
            let target = enemies.getChildren().find(e => Phaser.Math.Distance.Between(tower.x, tower.y, e.x, e.y) < range);
            if (target && this.time.now > tower.lastFire) {
                let bullet = this.physics.add.sprite(tower.x, tower.y, 'bullet').setScale(0.5);
                bullet.damage = damage; 
                this.physics.moveToObject(bullet, target, 500);
                bullets.add(bullet); 
                tower.lastFire = this.time.now + rate;
            }
        });
    }
    </script>
</body>
</html>
